<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Proof PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/app.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div>
        <h1>Email to PDF</h1>
        <p class="lede">Upload screenshots, fill the header, and export a merged proof.</p>
      </div>
      <button type="button" id="filesBtn" class="ghost">View generated files</button>
    </header>

    <section id="filesPanel" class="card hidden">
      <div class="section-head">
        <h2>Generated files</h2>
        <button type="button" id="deleteAllBtn" class="danger">Delete all</button>
      </div>
      <div id="filesList" class="files-list"></div>
    </section>

    <form id="form">
      <input type="hidden" name="folder" id="folder" value="">

      <section class="card">
        <h2>Export</h2>
        <div class="row-2">
          <label>
            Final PDF file name
            <input name="outputName" required placeholder="Merck_Rotateq_Email_1">
          </label>
          <label class="upload">
            Upload a folder of images
            <input id="folderUpload" type="file" webkitdirectory multiple>
            <em>Use names like <code>m1</code>, <code>d1</code>. Pair count is files ÷ 2.</em>
          </label>
        </div>
        <p id="found" class="found"></p>
      </section>

      <section class="card">
        <h2>Common details</h2>
        <div class="row-2">
          <label>
            From
            <select name="from" required>
              <option value="MD|DO Engage">MD|DO Engage</option>
              <option value="NP|PA Engage">NP|PA Engage</option>
            </select>
          </label>
          <label>
            To
            <input name="to" required value="Recipient's_E-mail_Address">
          </label>
          <label>
            CC
            <input name="cc" placeholder="optional">
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Subject <span>one per mobile + desktop pair</span></h2>
        <div id="layouts" class="empty-hint">Upload images to add a subject for each pair.</div>
      </section>

      <div class="actions">
        <button type="button" id="previewBtn" class="secondary">Preview</button>
        <button type="submit">Generate merged PDF</button>
      </div>
      <p id="status" class="status"></p>
    </form>

    <section class="card preview-panel">
      <h2>Preview</h2>
      <div id="tabs" class="tabs"></div>
      <iframe id="frame" title="Layout preview"></iframe>
    </section>
  </main>
  <script src="/public/app.js"></script>
</body>
</html>
